site_name: NoMem
site_description: LLM-free memory for AI agents. Verbatim storage, a hard token budget, and a log of every decision.
site_url: https://saswattulo.github.io/NoMem/
repo_url: https://github.com/saswattulo/NoMem
repo_name: saswattulo/NoMem
edit_uri: edit/main/docs/
copyright: Apache-2.0 · NoMem contributors

theme:
  name: material
  logo: assets/logo.svg
  favicon: assets/logo.svg
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
    - toc.follow
  icon:
    repo: fontawesome/brands/github

extra_css:
  - assets/extra.css

nav:
  - Home: index.md
  - Guide:
      - Getting started: getting-started.md
      - How it works: concepts.md
      - Facts and contradictions: facts-and-conflicts.md
      - Retrieval and vectors: retrieval.md
      - Configuration: configuration.md
      - Using it with an agent: integrations.md
  - Server:
      - HTTP API and MCP: server.md
  - Reference:
      - Python API: api.md
  - Benchmarks:
      - Results: benchmarks.md
      - NoMem vs Mem0: comparison.md
  - Project:
      - FAQ: faq.md
      - Changelog: changelog.md
      - Releasing: releasing.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/saswattulo/NoMem
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/nomem-ai/
exclude_docs: |
  _*.md
