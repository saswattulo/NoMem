name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev,mcp]"
      - run: pytest -q
      - name: Build and check the package
        run: |
          python -m build
          twine check --strict dist/*

  integrations:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # CrewAI pins openai<3 and the Agents SDK needs openai>=3, so they get separate envs.
        extras: ["anthropic,langgraph,openai-agents,llamaindex", "crewai"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev,${{ matrix.extras }}]"
      - run: pytest -q tests/test_integrations.py
